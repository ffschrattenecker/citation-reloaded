name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The obsidian-api dependency is fetched over git; make sure the
      # workflow can authenticate with the public repository over HTTPS.
      - name: Reconfigure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME of Citations Reloaded. See the changelog for details."

      # Attest the release artifacts so the Obsidian community directory can
      # verify they were built by this workflow.
      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: manifest.json

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css
